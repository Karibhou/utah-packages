# Make a fork pull request's own Canary check turn green once a maintainer-run
# Canary has passed on its exact head commit (#369).
#
# canary-fork-pr.yml runs Canary on an in-repository copy of the pull request.
# Its check run is real, but the pull request does not count it: a pull request
# rolls up the check suite for its own branch, and the copy lives on
# canary/pr-<N>. Observed on #622: the dispatched run passed on the head commit
# while the pull request kept the fork run's red Canary and stayed blocked.
#
# So the fork's own Canary job learns to find that proof (canary.yml, "Decide"),
# and this workflow re-runs it once the proof exists. It runs from main as a
# workflow_run, holds the write permissions the re-run needs, and never checks
# out or executes anything from the pull request: every value it reads from the
# triggering run is validated and passed through the environment.
name: Canary fork pull request refresh

on:
  workflow_run:
    workflows: [Canary]
    types: [completed]

permissions:
  actions: write
  pull-requests: write
  contents: read

jobs:
  refresh:
    # Only a successful maintainer-run copy; never a fork's own pull_request run.
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'canary/pr-')
    runs-on: ubuntu-24.04
    concurrency:
      group: canary-fork-refresh-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Re-run the pull request's Canary on the proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^canary/pr-([0-9]+)$ ]] || { echo "::error::not a canary copy branch: $BRANCH"; exit 1; }
          PR="${BASH_REMATCH[1]}"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full commit sha"; exit 1; }

          gh api "repos/$REPOSITORY/pulls/$PR" > pr.json
          # Only the exact commit that was proven, on a pull request still open
          # and still from a fork: a moved head needs its own review and run.
          if [ "$(jq -r .state pr.json)" != open ] || [ "$(jq -r .head.sha pr.json)" != "$HEAD_SHA" ]; then
            echo "::notice title=fork canary refresh::pull request $PR is closed or its head moved since this run; nothing to refresh"
            exit 0
          fi

          pr_run() {
            gh api "repos/$REPOSITORY/actions/workflows/canary.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=20" \
              --jq '[.workflow_runs[]] | sort_by(.created_at) | last // empty | "\(.id) \(.status) \(.conclusion // "none")"'
          }
          wait_done() {
            local line id status conclusion
            for _ in $(seq 1 60); do
              line=$(pr_run)
              [ -n "$line" ] || { sleep 10; continue; }
              read -r id status conclusion <<<"$line"
              [ "$status" = completed ] && { echo "$id $conclusion"; return 0; }
              sleep 10
            done
            echo "none timeout"
          }

          read -r id conclusion <<<"$(wait_done)"
          if [ "$id" = none ]; then
            echo "::error::no pull_request Canary run found for $HEAD_SHA"; exit 1
          fi
          if [ "$conclusion" = success ]; then
            echo "pull request Canary already passes (run $id)"; exit 0
          fi

          # Newest definition first: a re-run is cheap and quiet. It reuses the
          # workflow file the run started with, so a run that predates the proof
          # lookup in canary.yml fails the same way again.
          gh run rerun "$id" -R "$REPOSITORY" --failed
          sleep 15
          read -r id conclusion <<<"$(wait_done)"
          if [ "$conclusion" = success ]; then
            echo "pull request Canary passes after a re-run (run $id)"; exit 0
          fi

          # That run was started before canary.yml could read the proof. Closing
          # and reopening starts a fresh pull_request run on the same head
          # commit with the current workflow file, which can.
          echo "::notice title=fork canary refresh::run $id uses an older canary.yml; reopening pull request $PR to start a fresh run on the same commit"
          gh pr close "$PR" -R "$REPOSITORY"
          gh pr reopen "$PR" -R "$REPOSITORY"
          sleep 20
          read -r id conclusion <<<"$(wait_done)"
          test "$conclusion" = success || { echo "::error::pull request Canary is still $conclusion (run $id) after the proof"; exit 1; }
          echo "pull request Canary passes on a fresh run ($id)"
